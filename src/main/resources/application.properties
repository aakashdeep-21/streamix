spring.application.name=streamix
# Railway injects PORT; local default 8080
server.port=${PORT:8080}

# Storage: file (durable) | memory (tests/dev)
streamix.storage=file
streamix.data-dir=${STREAMIX_DATA_DIR:./data}

streamix.default-session-timeout-ms=30000
streamix.min-session-timeout-ms=1000
streamix.max-session-timeout-ms=3600000
streamix.session-sweep-ms=1000
streamix.poll-default-max=100
streamix.poll-max-limit=1000
streamix.batch-max-size=500
streamix.max-partitions-per-topic=64
streamix.max-message-bytes=1048576

management.endpoints.web.exposure.include=health,info,metrics
